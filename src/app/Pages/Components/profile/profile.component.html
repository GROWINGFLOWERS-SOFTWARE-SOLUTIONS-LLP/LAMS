 <div class="flex justify-content-center mt-3 px-3 mb-3">
  <p-card *ngIf="!loading && employee" class="w-full sm:w-10 md:w-8 lg:w-6 xl:w-5 shadow-4 ">
    <ng-template pTemplate="content">

      <!-- Profile Picture and Name/Role Responsive -->
      <div class="flex flex-column md:flex-row align-items-center md:align-items-start gap-3 mb-4">
        <!-- Square Profile Picture -->
        <img
          src="https://as1.ftcdn.net/jpg/01/68/80/20/1000_F_168802088_1msBk8PpBRCCVo012WJTpWG90KHvoMWf.jpg"
          alt="Profile Picture"
          class="w-10rem h-10rem border-1 surface-border shadow-2"
        />

        <!-- Name & Role block -->
        <div class=" md:pl-8 mt-5">
          <div class="text-2xl md:text-2xl font-bold mb-2">{{ employee.firstName }} {{ employee.lastName }}</div>
          <div class="text-center text-blue-400 text-sm font-bold md:text-base">{{ employee.role }}</div>
        </div>
      </div>

      <!-- Details Grid -->
      <div class="grid">
        <div class="col-12 sm:col-6 mb-3 flex align-items-start gap-2">
          <i class="pi pi-envelope mt-1"></i>
          <div>
            <strong>Email:</strong>
            <p class="m-0 break-word">{{ employee.emailId }}</p>
          </div>
        </div>

        <div class="col-12 sm:col-6 mb-3 flex align-items-start gap-2">
          <i class="pi pi-phone mt-1"></i>
          <div>
            <strong>Phone:</strong>
            <p class="m-0"> {{ employee.mobile }}</p>
          </div>
        </div>

        <div class="col-12 sm:col-6 mb-3 flex align-items-start gap-2">
          <i class="pi pi-briefcase mt-1"></i>
          <div>
            <strong>Joining Date:</strong>
            <p class="m-0">{{ employee.joiningDate | date }}</p>
          </div>
        </div>

        <div class="col-12 sm:col-6 mb-3 flex align-items-start gap-2">
          <i class="pi pi-briefcase mt-1"></i>
          <div>
            <strong>Department:</strong>
            <p class="m-0">{{ employee.department }}</p>
          </div>
        </div>

        <div class="col-12 sm:col-6 mb-3 flex align-items-start gap-2">
          <i class="pi pi-map-marker mt-1"></i>
          <div>
            <strong>Address:</strong>
            <p class="m-0">{{ employee.address }}</p>
          </div>
        </div>
      </div>

      <!-- Update Button -->
      <div class="flex justify-content-center mt-4">
        <button pButton type="button" label="Update Your Details" class="p-button-rounded p-button-primary" (click)="updateProfile()"></button>
      </div>

    </ng-template>
  </p-card>
</div>
