<div class="flex justify-content-center align-items-center mt-3 px-3">
  <p-card 
    *ngIf="!loading && employee" 
    class="w-full sm:w-30rem shadow-5 border-round-2xl surface-card" 
    [style]="{ padding: '1rem' }">
    
    <!-- Profile Avatar -->
    <div class="flex justify-content-center mb-3">
      <p-avatar 
        [image]="employee.profileImage || 'https://cdn-icons-png.flaticon.com/512/11753/11753627.png'" 
        size="xlarge" 
        shape="circle" 
        styleClass="shadow-4 ">
      </p-avatar>
    </div>

    <!-- Name & Role -->
    <div class="text-center font-bold text-2xl">{{ employee.firstName }} {{ employee.lastName }}</div>
    <div class="text-center mb-4 font-semibold text-lg text-primary">{{ employee.role }}</div>

    <!-- Profile Details -->
    <div class="flex flex-column gap-3 mb-4">
      <div class="flex justify-content-between border-bottom-1 surface-border pb-2">
        <strong>Email:</strong>
        <span class="text-900">{{ employee.emailId }}</span>
      </div>
      <div class="flex justify-content-between border-bottom-1 surface-border pb-2">
        <strong>Phone:</strong>
        <span class="text-900">{{ employee.mobile }}</span>
      </div>
      <div class="flex justify-content-between border-bottom-1 surface-border pb-2">
        <strong>Department:</strong>
        <span class="text-900">{{ employee.department }}</span>
      </div>
      <div class="flex justify-content-between border-bottom-1 surface-border pb-2">
        <strong>Joining Date:</strong>
        <span class="text-900">{{ employee.joiningDate | date }}</span>
      </div>
      <div class="flex justify-content-between">
        <strong>Location:</strong>
        <span class="text-900">{{ employee.address }}</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-content-center gap-3 mt-4">
      <p-button 
        label="Edit Profile" 
        icon="pi pi-user-edit" 
        styleClass="p-button-rounded p-button-primary"
        (click)="updateProfile()">
      </p-button>
    </div>

  </p-card>
</div>
