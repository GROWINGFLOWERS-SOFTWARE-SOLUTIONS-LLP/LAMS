<p-toast></p-toast>

<div class="container h-screen">
  <div class="p-fluid">
    <div class="p-card">
      <div class="flex justify-content-end mb-3">
        <p-button label="Leave Application Form" (onClick)="showDialog()"></p-button>
      </div>

      <p-dialog header="Leave Application Form" [(visible)]="visible" [modal]="true" [closable]="false"
        [style]="{ width: '50rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
      </p-dialog>

      <div class="mt-3" style="position: relative;">
        <p-table [value]="leaveRequests" [paginator]="showPaginator" [rows]="8" [scrollable]="true" responsiveLayout="scroll"
          class="responsive-table">
          <ng-template pTemplate="header">
            <tr>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Leave Type</th>
              <th>Total Leaves</th>
              <th>Status</th>
              <th>Reason</th>
            </tr>
          </ng-template>

          <!-- Table Body with Loading Overlay -->
          <ng-template pTemplate="body" let-request>
            <tr *ngIf="!isLoading">
              <td>{{ request.startDate | date:'yyyy-MM-dd' }}</td>
              <td>{{ request.endDate | date:'yyyy-MM-dd' }}</td>
              <td>{{ request.leaveType }}</td>
              <td>{{ request.totalLeaves }}</td>
              <td><span class="p-tag p-tag-warning">Pending</span></td>
              <td>{{ request.reason }}</td>
            </tr>
          </ng-template>
        </p-table>

        <div *ngIf="isLoading" class="table-loader-overlay">
          <app-loader [loading]="isLoading"></app-loader>
        </div>
      </div>
    </div>
  </div>
</div>
