<div class="container p-4">
  <app-loader [loading]="isLoading"></app-loader>

  <main class="history-list" *ngIf="!isLoading">
    <h2>History List</h2>

    <ng-container *ngIf="hasHistory(); else noHistory">
      <ul>
        <li *ngFor="let item of historyData">
          <div>
            <time><strong>Date:</strong> {{ item.creationDate | date: 'dd-MM-yyyy' }}</time>
            <div class="event-details">
              <h3> <strong>Activity:</strong> {{ item.activity || 'No Activity' }}</h3>
            </div>
          </div>
        </li>
      </ul>
    </ng-container>

    <ng-template #noHistory>
      <div class="text-center text-color-secondary py-5">
        <p>No history records found.</p>
      </div>
    </ng-template>
  </main>
</div>
