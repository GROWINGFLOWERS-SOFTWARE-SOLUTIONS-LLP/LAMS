<section>
  <div class="center-container">
    <p-avatar icon="pi pi-user" styleClass="mr-2" size="xlarge" shape="circle"></p-avatar>
  </div>
  <div class="container">
    <form #profileForm="ngForm" (ngSubmit)="onSubmit(profileForm)">
      <div class="column">
        <div class="input-box">
          <label>First Name</label>
          <input type="text" name="firstName" [(ngModel)]="employee.firstName" placeholder="Enter first name"
            required />
        </div>
        <div class="input-box">
          <label>Last Name</label>
          <input type="text" name="lastName" [(ngModel)]="employee.lastName" placeholder="Enter last name" required />
        </div>
      </div>
      <div class="column">
        <div class="input-box">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="employee.email" placeholder="Enter email address" required />
        </div>
        <div class="input-box">
          <label>Phone Number</label>
          <input type="tel" name="mobileNumber" [(ngModel)]="employee.mobileNumber" placeholder="Enter phone number"
            required />
        </div>
      </div>
      <div class="column">
        <div class="input-box">
          <label>Department</label>
          <div class="select-box">
            <select name="department" [(ngModel)]="employee.department">
              <option hidden>Department</option>
              <option>Engineering</option>
              <option>QA Testing</option>
              <option>Admin</option>
              <option>Human Resources</option>
            </select>
          </div>
        </div>
        <div class="input-box">
          <label>Designation</label>
          <input type="text" name="role" [(ngModel)]="employee.role" placeholder="Enter Designation" required />
        </div>
        <div class="input-box">
          <label>Joining Date</label>
          <input type="date" name="joiningDate" [(ngModel)]="employee.joiningDate" required />
        </div>
      </div>
      <div class="input-box address">
        <label>Address</label>
        <input type="text" name="address" [(ngModel)]="employee.address" placeholder="Enter street address" required />
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
        <p-button label="Update" type="submit"></p-button>
      </div>
    </form>
  </div>
</section>
