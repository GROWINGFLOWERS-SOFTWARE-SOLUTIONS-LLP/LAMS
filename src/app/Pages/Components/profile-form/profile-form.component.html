<p-toast></p-toast>

<section class="p-m-4">
  <div class="flex justify-content-center">
    <div class="surface-card p-4 shadow-2 border-round w-full md:w-8 lg:w-6">
      <div class="text-center mb-4">
        <p-avatar icon="pi pi-user" size="xlarge" shape="circle" class="mb-3"></p-avatar>
        <h3>Update Profile</h3>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="p-fluid">
        <div class="formgrid grid">
          <div class="field col-12 md:col-6">
            <label for="firstName">First Name</label>
            <input pInputText formControlName="firstName" [disabled]="true" />
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="lastName">Last Name</label>
            <input pInputText formControlName="lastName" [disabled]="true" />
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="email">Email</label>
            <input pInputText type="email" formControlName="emailId" [disabled]="true" />
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="mobile">Phone Number</label>
            <input pInputText type="tel" formControlName="mobile" />
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="department">Department</label>
            <p-dropdown [options]="department" optionLabel="departmentName" optionValue="departmentName" formControlName="department" placeholder="Select Department">
            </p-dropdown>
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="role">Designation</label>
            <input pInputText formControlName="role" />
          </div>
      
          <div class="field col-12 md:col-6">
            <label for="joiningDate">Joining Date</label>
            <p-calendar inputId="joiningDate" formControlName="joiningDate" dateFormat="yy-mm-dd" [disabled]="true"></p-calendar>
          </div>
      
          <div class="field col-12">
            <label for="address">Address</label>
            <textarea pInputTextarea formControlName="address" rows="3"></textarea>
          </div>
        </div>
      
        <div class="flex justify-content-center mt-4 p-col-12 p-md-6">
          <div class="text-center">
            <button pButton label="Update" type="submit" class="p-button-primary p-button-sm" [disabled]="profileForm.invalid">
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
