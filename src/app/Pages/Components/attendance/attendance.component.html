<p-toast></p-toast>

<div class="container">

 <p-dialog [(visible)]="displayPunchInDialog" 
          [modal]="true" 
          [closable]="false"
          [style]="{ width: '20rem', borderRadius: '1rem', textAlign: 'center', background: 'linear-gradient(135deg, #f5f0ff, #e0d4ff)' }"
          >

  <!-- Avatar & Title with pulse -->
  <div class="flex flex-column align-items-center justify-content-center mb-3">
    <p-avatar image="https://brewermaine.gov/wp-content/uploads/2021/06/33-337804_transparent-booking-icon-png-calendar-icon-png-blue.png" 
              shape="circle" 
              size="xlarge" 
              class="mb-2 animate-pulse"></p-avatar>
    <h2 class="m-0 text-purple-700 font-bold">Attendance</h2>
  </div>

  <!-- Date & Time badges -->
  <div class="flex flex-column align-items-center justify-content-center mb-4 gap-2">
    <span class="p-tag p-tag-rounded p-tag-info font-bold">{{ attendance_date }}</span>
    <span class="p-tag p-tag-rounded p-tag-warning font-bold">{{ currentTime }}</span>
  </div>

  <!-- Punch In Button with glow effect -->
  <p-button label="Punch In" 
            icon="pi pi-check" 
            (click)="punchIn()" 
            class="p-button-rounded p-button-lg p-button-success w-full shadow-5 hover:shadow-6"
             [style]="{
              background: 'linear-gradient(90deg, #6a11cb 0%, #2575fc 100%)',
              border: 'none',
              color: 'white',
              fontWeight: 'bold'
            }"></p-button>

  <!-- Motivational text -->
  <div class="mt-3 text-gray-700 font-medium text-sm">
    🌟 Have a productive day and enjoy your work!
  </div>
</p-dialog>

  <!-- Wrap filters and table inside a card -->
  <p-card class="mb-4 shadow-3 surface-card border-round-lg">
    <div
      class="flex flex-column sm:flex-row justify-content-end align-items-start sm:align-items-center mb-4 gap-3 pr-3">
      <div class="flex flex-column sm:flex-row justify-content-between align-items-center mb-3 gap-3 w-full">
        <!-- Heading -->
        <div class="text-2xl font-semibold text-blue-700 lg:pl-5">
          Attendance Records
        </div>

      <!-- Search Section -->
<div class="flex flex-column sm:flex-row sm:align-items-center sm:w-auto gap-1">
<p-calendar
  id="searchdate"
  [(ngModel)]="fromDate"
  (onSelect)="onDateChange()"
  dateFormat="dd/mm/yy"
  placeholder="Select Date"
  showIcon="true"
  panelStyleClass="custom-calendar-panel"
></p-calendar>
  
  <button
    pButton
    type="button"
    icon="pi pi-times"
    class="p-button-text"
    (click)="clearDateFilter()"
  ></button>
</div>

      </div>

    </div>

    <div class="w-full sm:w-10 md:w-8 lg:w-10 mx-auto">
      <p-table [value]="filteredAttendanceRecords" [rows]="10" [scrollable]="true" scrollHeight="400px"
        responsiveLayout="scroll" class="mt-3">
        <ng-template pTemplate="header">
          <tr>
            <th class="text-sm text-left">Date</th>
            <th class="text-sm text-left">Check-In</th>
            <th class="text-sm text-left">Check-Out</th>
            <th class="text-sm text-left">Time Spent</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-record>
          <tr *ngIf="!loading">
            <td class="text-sm">{{ record.date }}</td>
            <td class="text-sm">{{ record.checkIn }}</td>
            <td class="text-sm">{{ record.checkOut }}</td>
            <td class="text-sm">{{ record.breaktime }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="empty">
          <tr>
            <td colspan="4" class="text-center text-gray-500">
              No attendance records found.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>


  </p-card>

</div>
