<p-toast></p-toast>

<div class="container">

  <p-dialog [(visible)]="displayPunchInDialog" [modal]="true" [closable]="false"
    class="flex flex-column align-items-center text-center">
    <div class="dialog-content flex flex-column align-items-center p-3">
      <h2>Attendance</h2>
      <p-avatar image="https://cdn-icons-png.flaticon.com/512/1869/1869397.png" shape="circle" size="xlarge"
        class="avatar-image mb-2"></p-avatar>
      <div class="attendance-panel mb-2">{{ attendance_date }}</div>
      <div class="font-size-lg mb-3">{{ currentTime }}</div>
      <p-button label="Punch In" icon="pi pi-check" (click)="punchIn()" class="punch-in-button"></p-button>
    </div>
  </p-dialog>

  <!-- Wrap filters and table inside a card -->
  <p-card class="mb-4 shadow-3 surface-card border-round-lg">
    <div
      class="flex flex-column sm:flex-row justify-content-end align-items-start sm:align-items-center mb-4 gap-3 pr-3">
      <div class="flex flex-column sm:flex-row justify-content-between align-items-center mb-3 gap-3 w-full">
        <!-- Heading -->
        <div class="text-2xl font-semibold text-blue-700 lg:pl-5">
          Attendance Records
        </div>

        <!-- Search Section -->
      <!-- Search Section -->
<div class="flex flex-column sm:flex-row sm:align-items-center sm:w-auto gap-1">
<p-calendar
  id="searchdate"
  [(ngModel)]="fromDate"
  (onSelect)="onDateChange()"
  dateFormat="dd/mm/yy"
  placeholder="Select Date"
  showIcon="true"
  panelStyleClass="custom-calendar-panel"
></p-calendar>
  
  <button
    pButton
    type="button"
    icon="pi pi-times"
    class="p-button-text"
    (click)="clearDateFilter()"
  ></button>
</div>

      </div>

    </div>

    <div class="w-full sm:w-10 md:w-8 lg:w-10 mx-auto">
      <p-table [value]="filteredAttendanceRecords" [rows]="10" [scrollable]="true" scrollHeight="400px"
        responsiveLayout="scroll" class="mt-3">
        <ng-template pTemplate="header">
          <tr>
            <th class="text-sm text-left">Date</th>
            <th class="text-sm text-left">Check-In</th>
            <th class="text-sm text-left">Check-Out</th>
            <th class="text-sm text-left">Time Spent</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-record>
          <tr *ngIf="!loading">
            <td class="text-sm">{{ record.date }}</td>
            <td class="text-sm">{{ record.checkIn }}</td>
            <td class="text-sm">{{ record.checkOut }}</td>
            <td class="text-sm">{{ record.breaktime }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="empty">
          <tr>
            <td colspan="4" class="text-center text-gray-500">
              No attendance records found.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>


  </p-card>

</div>
