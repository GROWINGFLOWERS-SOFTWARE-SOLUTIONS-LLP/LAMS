<p-toast></p-toast>

<div class="grid m-0 min-h-screen ">
  <!-- Left Image Column -->
  <div class="col-12 md:col-6 flex justify-content-center align-items-center p-4">
    <img
      src="https://static.vecteezy.com/system/resources/previews/002/616/165/non_2x/young-man-using-computer-in-desk-working-online-vector.jpg"
      class="w-full max-w-30rem md:w-10 h-auto"
      alt="HR Portal Banner"
    />
  </div>

  <!-- Right Login Form Column -->
  <div class="col-12 md:col-6 flex align-items-center justify-content-center p-4">
    <div class="w-full" style="max-width: 30rem;">
      <!-- Glass Card -->
      <div class="surface-card p-5 shadow-6 border-round-2xl glass-card">

        <!-- Heading -->
        <div class="text-center mb-4">
          <h2 class="text-3xl font-bold mt-3 text-blue-600">LAMS LOGIN</h2>
          <div class="overflow-hidden h-6 my-2">
            <div class="animate-marquee text-green-600 font-semibold text-sm">
              👋 Say Goodbye to Manual Logs! 📋✨ Automate Attendance & Leave ⏱️🗓️ – Empower Your Workforce 💪
            </div>
          </div>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="loginFun()">
          <!-- Email -->
          <div class="mb-4">
            <label for="emailId" class="block text-900 font-medium mb-2">Email</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-envelope text-green-600"></i>
              <input
                id="emailId"
                type="email"
                pInputText
                formControlName="emailId"
                placeholder="Enter your email"
                class="w-full p-inputtext-sm border-round-xl"
              />
            </span>
            <small *ngIf="emailId.invalid && (emailId.dirty || emailId.touched)" class="text-red-500">
              <div *ngIf="emailId.errors?.['required']">Email is required.</div>
              <div *ngIf="emailId.errors?.['email']">Enter a valid email.</div>
            </small>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="password" class="block text-900 font-medium mb-2">Password</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-lock text-green-600"></i>
              <input
                id="password"
                type="password"
                pPassword
                formControlName="password"
                placeholder="Enter your password"
                class="w-full p-inputtext-sm border-round-xl"
                [feedback]="false"
              />
            </span>
            <small *ngIf="password.invalid && (password.dirty || password.touched)" class="text-red-500">
              <div *ngIf="password.errors?.['required']">Password is required.</div>
            </small>
          </div>

          <!-- Forgot Password -->
          <div class="flex justify-content-end mb-3">
            <a href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            pButton
            label="Login"
            class="w-full text-lg font-semibold border-none border-round-xl shadow-2"
            [disabled]="loginForm.invalid"
            style="background: linear-gradient(to right, #38b2ac, #68d391); color: white;"
          ></button>
        </form>
      </div>
    </div>
  </div>
</div>
