<div class="card justify-content-center">
    <p-card header="Change Password">
    
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
          <div class="p-fluid">
            <div class="p-field">
              <label for="currentPassword">Current Password</label>
              <p-password id="currentPassword" formControlName="currentPassword" toggleMask="true" required></p-password>
              <div *ngIf="passwordForm.get('currentPassword').invalid && passwordForm.get('currentPassword').touched" class="p-error">
                Current Password is required.
              </div>
            </div>
      
            <div class="p-field">
              <label for="newPassword">New Password</label>
              <p-password id="newPassword" formControlName="newPassword" toggleMask="true" required></p-password>
              <div *ngIf="passwordForm.get('newPassword').invalid && passwordForm.get('newPassword').touched" class="p-error">
                New Password is required.
              </div>
            </div>
    
            <div class="p-field">
              <label for="confirmPassword">Confirm New Password</label>
              <p-password id="confirmPassword" formControlName="confirmPassword" toggleMask="true" required></p-password>
              <div *ngIf="passwordForm.get('confirmPassword').invalid && passwordForm.get('confirmPassword').touched" class="p-error">
                Confirm Password is required.
              </div>
              <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword').touched" class="p-error">
                Passwords do not match.
              </div>
            </div>
      
            <p-button label="Change Password" type="submit" [disabled]="passwordForm.invalid"></p-button>
          </div>
        </form>
        </p-card>
      </div>
