<p-toast></p-toast>

<div class="background-image-wrapper min-h-screen flex align-items-center justify-content-center p-3">
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="p-fluid w-full md:w-6 lg:w-4">
    <p-card header="Change Password" class="border-round text-center shadow-4">
      
      <!-- Current Password -->
      <div class="p-field grid mb-2">
        <label for="currentPassword" class="col-12 font-medium text-left">Current Password</label>
        <div class="col-12">
          <p-password formControlName="currentPassword" toggleMask="true" class="w-full" variant="filled"></p-password>
          <div *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched"
            class="p-error block mt-2 text-sm text-left">
            Current Password is required.
          </div>
        </div>
      </div>

      <!-- New Password -->
      <div class="p-field grid mb-2">
        <label for="newPassword" class="col-12 font-medium text-left">New Password</label>
        <div class="col-12">
          <p-password formControlName="newPassword" toggleMask="true" class="w-full" variant="filled"></p-password>
          <div *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
            class="p-error block mt-2 text-sm text-left">
            New Password is required.
          </div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="p-field grid mb-2">
        <label for="confirmPassword" class="col-12 font-medium text-left">Confirm Password</label>
        <div class="col-12">
          <p-password formControlName="confirmPassword" toggleMask="true" class="w-full" variant="filled"></p-password>
          <div *ngIf="passwordForm.get('confirmPassword')?.invalid && passwordForm.get('confirmPassword')?.touched"
            class="p-error block mt-2 text-sm text-left">
            Confirm Password is required.
          </div>
          <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.touched"
            class="p-error block mt-2 text-sm text-left">
            Passwords do not match.
          </div>
        </div>
      </div>

      <!-- Submit -->
      <div class="grid justify-content-center mt-2">
        <p-button label="Change Password" severity="primary" type="submit" [disabled]="passwordForm.invalid" class="w-full p-2"></p-button>
      </div>

    </p-card>
  </form>
</div>
