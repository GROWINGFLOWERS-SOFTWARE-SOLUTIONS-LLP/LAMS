<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="container flex flex-column p-4 bg-gray-50 h-screen">
    <!-- Reusable loader -->
    <!-- <app-loader [loading]="loading"></app-loader> -->

    <!-- Employee Table -->
    <div class="flex-grow-1 overflow-auto p-4" *ngIf="!loading">
        <div class="p-grid">
            <div class="p-col-12">
                <p-table [value]="employees" [paginator]="true" [rows]="5" [scrollable]="true"
                    class="shadow-md rounded-lg border border-gray-300 mb-4">
                    <ng-template pTemplate="header">
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3">First Name</th>
                            <th class="p-3">Last Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Role</th>
                            <th class="p-3">Date</th>
                            <th class="p-3">Attendance</th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body" let-employee>
                        <tr class="text-gray-600 hover:bg-gray-100 transition">
                            <td class="p-3">{{ employee.firstName }}</td>
                            <td class="p-3">{{ employee.lastName }}</td>
                            <td class="p-3">{{ employee.emailId }}</td>
                            <td class="p-3">{{ employee.role }}</td>
                            <td class="p-3">{{ currentDate }}</td>
                            <td class="p-3">
                                <span [ngClass]="{
                                    'text-green-600 font-medium': employee.attendanceStatus === 'Present',
                                    'text-red-500 font-medium': employee.attendanceStatus === 'Absent'
                                }">
                                    {{ employee.attendanceStatus }}
                                </span>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>
