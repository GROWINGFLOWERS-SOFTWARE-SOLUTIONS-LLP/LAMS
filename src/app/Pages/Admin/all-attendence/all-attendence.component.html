<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="container flex flex-column ">
    <p-card header="Employee Attendance" class="w-full shadow-2">
        <!-- Filters -->
        <div class="grid mb-4">

            <!-- Search Employee -->
            <div class="col-12 sm:col-6 md:col-2">
                <label>Employee Name:</label>
                <input type="text" [(ngModel)]="searchEmployee" placeholder="Search by name"
                    class="p-inputtext p-component w-full" />
            </div>

            <!-- From Date -->
            <div class="col-12 sm:col-6 md:col-3">
                <label>From Date:</label>
                <input type="date" [(ngModel)]="fromDate" class="p-inputtext p-component w-full" />
            </div>

            <!-- To Date -->
            <div class="col-12 sm:col-6 md:col-3">
                <label>To Date:</label>
                <input type="date" [(ngModel)]="toDate" class="p-inputtext p-component w-full" />
            </div>

            <!-- Filter Button -->
            <div class="col-12 sm:col-6 md:col-2 flex align-items-end">
                <button pButton label="Filter" (click)="filterByDateRange()" class="p-button-primary w-full"></button>
            </div>

            <!-- Download Button -->
            <div class="col-12 sm:col-6 md:col-2 flex align-items-end">
                <button pButton label="Download" (click)="downloadFilteredData()"
                    class="p-button-success w-full"></button>
            </div>
        </div>

        <!-- Employee Table -->
        <div *ngIf="!loading" class="overflow-auto">
            <p-table [value]="attendList" [paginator]="true" [rows]="10" [scrollable]="true"
                class="shadow-sm rounded-lg border border-gray-300 mb-4">

                <ng-template pTemplate="header">
                    <tr class="bg-gray-200 text-gray-700">
                        <!-- <th class="p-3">Employee ID</th> -->
                        <th class="p-3">Employee Name</th>
                        <th class="p-3">Date</th>
                        <th class="p-3">Check-In</th>
                        <th class="p-3">Check-Out</th>
                        <th class="p-3">Status</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-att>
                    <tr class="text-gray-600 hover:bg-gray-100 transition">
                        <!-- <td class="p-3">{{ att.employeeId }}</td> -->
                        <td class="p-3">{{ att.employeeName }}</td>
                        <td class="p-3">{{ att.date }}</td>
                        <td class="p-3">{{ att.checkIn || 'N/A' }}</td>
                        <td class="p-3">{{ att.checkOut || 'N/A' }}</td>
                        <td class="p-3">
                            <span [ngClass]="{
    'text-green-600 font-medium': att.checkIn && att.checkOut,
    'text-orange-500 font-medium': att.checkIn && !att.checkOut,
    'text-red-500 font-medium': !att.checkIn
  }">
                                {{ att.checkIn && att.checkOut ? 'Present' :
                                att.checkIn && !att.checkOut ? 'Half Day' : 'Absent' }}
                            </span>
                        </td>

                    </tr>
                </ng-template>
            </p-table>
        </div>

    </p-card>
</div>
