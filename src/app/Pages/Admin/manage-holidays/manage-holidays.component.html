<p-confirmDialog></p-confirmDialog>

<p-card class="shadow-3 p-0 m-0">

  <div *ngIf="!isLoading">
    <div class="flex justify-content-between align-items-center flex-wrap gap-2">

      <h2 class="text-2xl font-bold pl-6">Holiday List</h2>

      <!-- <p-button label="{{ !showHolidayList ? 'Add Holiday' : 'List of Holidays' }}" class="p-button-primary p-button-sm"
        severity="primary" (click)="toggleHolidayList()" >

      </p-button> -->
       <p-button label="{{ !showHolidayList ? 'Add Holiday' : 'List of Holidays' }}" [text]="true" [raised]="true"  (click)="toggleHolidayList()" [style]="{
              background: 'linear-gradient(90deg, #2575fc 0%, #6a11cb 100%)',
              border: 'none',
              color: 'white',
              fontWeight: 'bold'
            }"/>
    </div>


    <!-- Add Holiday Form -->
    <div class="flex justify-content-center mb-4" *ngIf="showHolidayList">
      <div class="p-fluid w-full md:w-8 lg:w-6">
        <div class="border-1 border-round p-3 shadow-2 bg-white">
          <h2 class="text-2xl font-bold text-center mb-3">{{ selectedHolidayId ? 'Edit Holiday' : 'Add Holiday' }}</h2>

          <form [formGroup]="holidayForm" (ngSubmit)="onSubmit()">
            <div class="grid formgrid p-fluid">
              <!-- Holiday Name -->
              <div class="col-12 lg:col-6">
                <div class="field">
                  <label for="holidayName" class="font-semibold">Holiday Name</label>
                  <input id="holidayName" type="text" class="p-inputtext p-component w-full border-1 border-round"
                    placeholder="Enter Holiday Name" formControlName="holidayName" />
                </div>
              </div>

              <!-- Holiday Date -->
              <div class="col-12 lg:col-6">
                <div class="field">
                  <label for="holidayDate" class="font-semibold">Holiday Date</label>
                  <input id="holidayDate" type="date" class="p-inputtext p-component w-full border-1 border-round"
                    formControlName="holidayDate" />
                </div>
              </div>

              <!-- Submit Button -->
              <div class="col-12 flex justify-content-center mt-3">
                <button type="submit" class="p-button p-component p-button-primary" [disabled]="holidayForm.invalid">
                  <span class="p-button-label">{{ selectedHolidayId ? 'Update Holiday' : 'Add Holiday' }}</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Holiday Table -->
    <div *ngIf="!showHolidayList" class="p-fluid w-full md:w-10 lg:w-8 mx-auto mt-4">
  <p-card class="shadow-4">
    <!-- Card Title -->
    <ng-template pTemplate="header">
      <!-- <div class="text-2xl font-bold">Holiday List</div> -->
    </ng-template>

    <!-- Table Content -->
    <div style="max-height: calc(100vh - 200px); overflow-y: auto;">
      <p-table [value]="holidays" [paginator]="true" [rows]="4" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>Holiday Name</th>
            <th>Holiday Date</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-holiday>
          <tr>
            <td>{{ holiday.holidayName }}</td>
            <td>{{ holiday.holidayDate }}</td>
            <td>
              <!-- <button type="button" class="p-button p-component p-button-success" (click)="editHoliday(holiday)">
                <span class="p-button-label">Edit</span>
              </button> -->
             <p-button label="Edit" [rounded]="true" [text]="true" [raised]="true" severity="success"  (click)="editHoliday(holiday)"/>
            </td>
            <td>
              <!-- <p-button label="Delete" severity="danger" [outlined]="true" (onClick)="deleteHoliday(holiday)">
              </p-button> -->
             <p-button label="Delete" [rounded]="true" [text]="true" [raised]="true" severity="danger" (onClick)="deleteHoliday(holiday)"/>

            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center text-gray-500">No holidays found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>

  </div>
</p-card>

<!-- Toast Notification -->
<p-toast></p-toast>
